<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Every Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: summary strip over a grid of envelope-folder cards; four tabbed views (Accounts, Paycheck, History, Plan); entry sheets slide up from the bottom. */
:root{
  --bg:#EEF2E1; --surface:#FDFEF8; --surface2:#F1F5E2; --line:#D6DDBF;
  --ink:#1B2A1E; --muted:#59694F; --accent:#2E6B3E; --accent-ink:#FFFFFF; --accent-soft:#E0ECC6;
  --gold:#F2C94C; --gold-soft:#FAF0C4; --on-gold:#3A2E00;
  --pos:#1F7A3E; --neg:#B3261E; --warn:#9A6200;
  --tabL:.92; --tabT:.36; --dotL:.64;
  --shadow:0 1px 2px rgba(27,42,30,.05),0 10px 24px -14px rgba(27,42,30,.24);
  --scrim:rgba(14,24,16,.5);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A12; --surface:#17251B; --surface2:#1E2F23;
    --line:#2D4333; --ink:#E9F0DD; --muted:#A3B49A; --accent:#86CF84; --accent-ink:#0B1C10; --accent-soft:#25402B;
    --gold:#E9C75A; --gold-soft:#332E14; --on-gold:#231C00;
    --pos:#7FD98F; --neg:#FF9A90; --warn:#E5B34F;
    --tabL:.34; --tabT:.9; --dotL:.74;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A12; --surface:#17251B; --surface2:#1E2F23;
  --line:#2D4333; --ink:#E9F0DD; --muted:#A3B49A; --accent:#86CF84; --accent-ink:#0B1C10; --accent-soft:#25402B;
  --gold:#E9C75A; --gold-soft:#332E14; --on-gold:#231C00;
  --pos:#7FD98F; --neg:#FF9A90; --warn:#E5B34F;
  --tabL:.34; --tabT:.9; --dotL:.74;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
.app{max-width:980px;margin-inline:auto;padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
button{font:inherit;cursor:pointer}
.mono,.lbl{font-family:var(--f-mono)}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font-size:23px;font-weight:700;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--f-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 12px;min-height:34px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.status[data-s="saving"] i{background:var(--muted)}
.status[data-s="local"] i{background:var(--warn)}
.status[data-s="error"] i{background:var(--neg)}
.status[data-s="error"]{color:var(--neg);border-color:var(--neg)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:2px}
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{flex:1;min-width:0;min-height:40px;border:0;background:transparent;color:var(--muted);border-radius:10px;font:500 14px var(--f-body);padding:0 6px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{filter:brightness(1.05)}
.sub.neg{color:var(--neg)}
.gold-card{background:var(--gold-soft)!important;border-color:transparent!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:500 13px var(--f-body)}
.chip:hover{border-color:var(--accent)}
.callout .chip{background:var(--surface)}
.opts{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px}
.opts .main-sel{margin-top:0;flex:1 1 240px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:oklch(var(--dotL) .15 var(--h));flex:none}
.hint{margin:0;color:var(--muted);font-size:13px;min-height:1.2em}
.hint b{color:var(--ink);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%;min-width:0}
.money{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding-left:12px;min-width:0}
.money:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.money span{color:var(--muted);font-family:var(--f-mono)}
.money input{border:0;background:transparent;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding-left:6px;outline:none}
.money.big input{font-size:22px;min-height:54px}
.money.big span{font-size:20px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}

/* accounts */
.strip{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.strip .panel{display:flex;flex-direction:column;gap:6px}
.big-n{font:700 clamp(34px,8vw,50px)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mid-n{font:700 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted)}
.spread{display:flex;gap:3px;height:12px;margin-top:10px}
.spread i{display:block;min-width:3px;border-radius:4px;background:oklch(var(--dotL) .15 var(--h))}
.spread.empty{background:var(--surface2);border-radius:6px;border:1px dashed var(--line)}
.strip .btn{margin-top:auto;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 16px}
.env{display:flex;flex-direction:column;min-width:0}
.env .tab{align-self:flex-start;max-width:100%;padding:5px 10px 4px;border-radius:9px 9px 0 0;font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:oklch(var(--tabL) .07 var(--h));color:oklch(var(--tabT) .09 var(--h));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:-1px;position:relative}
.env .body{flex:1;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:0 13px 13px 13px;padding:16px;box-shadow:var(--shadow);min-width:0}
.env .bal{font:700 28px/1.1 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.env .meta{font:400 11.5px var(--f-mono);color:var(--muted)}
.env .last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.env .btn{margin-top:auto;width:100%}
.callout{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--accent-soft);border-color:transparent}
.callout p{margin:0;max-width:60ch}

/* paycheck */
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start}
.pl-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.pl{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .dot{margin-top:5px}
.pl-n{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-x{font-size:12.5px}
.pl-a{font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.sumrows{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sumrows div{display:flex;justify-content:space-between;gap:10px;font:500 13.5px var(--f-mono);font-variant-numeric:tabular-nums}
.sumrows div span:first-child{color:var(--muted);font-family:var(--f-body)}
.recent{list-style:none;margin:10px 0 0;padding:0}
.recent li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent .grow{flex:1;min-width:0}

/* history */
.hist-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hist-head select{width:auto;min-width:200px;max-width:100%}
.mh{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.hl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hr{display:grid;grid-template-columns:50px minmax(0,1fr) auto 34px;gap:10px;align-items:center;padding:11px 10px 11px 14px;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hd{font:500 12px var(--f-mono);color:var(--muted)}
.hm{display:flex;flex-direction:column;min-width:0}
.hm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ha{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.x{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:0}
.x:hover{background:var(--surface2);color:var(--ink)}
.x.armed{background:var(--neg);color:#fff;width:auto;padding:0 8px;font-size:12px}
.empty-state{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-state b{display:block;color:var(--ink);font:700 18px var(--f-display);margin-bottom:4px}

/* plan */
.plan-top{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.p-top{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.p-bot{display:flex;align-items:center;gap:8px;flex:0 1 auto}
.p-bot .money{width:132px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:30px;height:20px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:6px;font-size:10px;line-height:1;padding:0}
.mv button:hover{color:var(--ink)}
.mv button:disabled{opacity:.35;cursor:default}
.pname{font-weight:600}
.main-sel{display:flex;flex-direction:column;gap:6px;max-width:320px;margin-top:14px;font-size:13px;color:var(--muted);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:21px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,140px);gap:8px;align-items:center;padding:7px 0}
.brow.two-f{grid-template-columns:1fr 1fr;padding:9px 0;border-top:1px solid var(--line)}
.brow.two-f .bn{grid-column:1/-1}
.bn{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.bn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bsum{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin:10px 0 16px;padding-top:10px;font:500 14px var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:min(92vw,420px);z-index:30;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .scrim{align-items:center;padding:16px}
  .sheet{border-radius:20px;padding-bottom:18px}
}
@media (max-width:720px){
  .two{grid-template-columns:1fr}
}
@media (max-width:640px){
  .strip{grid-template-columns:1fr 1fr}
  .strip .total{grid-column:1/-1}
  .plan-top{grid-template-columns:1fr 1fr}
  .plan-top .panel:first-child{grid-column:1/-1}
  .brand h1{font-size:20px}
}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 22px 0 18px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--f-body);box-shadow:0 10px 26px -8px rgba(20,50,28,.55)}
.fab:hover{filter:brightness(1.08)}
.fab[hidden]{display:none}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 14px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.mi:hover{border-color:var(--accent)}
.mi-ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mi b{display:block;font:600 15px var(--f-body)}
.mi small{display:block;color:var(--muted);font-size:13px}
.eh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0}
.eh .tab{min-width:0}
.more{flex:none;width:34px;height:30px;margin-bottom:2px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:20px;line-height:1;padding:0}
.more:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff}
.verse{background:var(--gold-soft);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.verse p{margin:0}
.vq{font:500 15.5px/1.5 var(--f-display);text-wrap:pretty}
.vr{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.vq2{font-size:13px;color:var(--muted)}
.v-acc,.v-pay,.v-plan{display:flex;flex-direction:column;gap:18px}
.v-hist .hist-head{margin-bottom:4px}
.fine{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.strip{grid-template-columns:1fr}.strip .total{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><circle cx="17" cy="17" r="14.5" fill="var(--gold)" stroke="var(--on-gold)" stroke-width="2"/><circle cx="17" cy="17" r="10.5" stroke="var(--on-gold)" stroke-width="1.4" opacity=".45"/><text x="17" y="22.4" text-anchor="middle" font-family="Bricolage Grotesque,Avenir Next,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="var(--on-gold)">$</text></svg>
      <h1>Every Coin</h1>
    </div>
    <button class="status" id="status" data-act="retry" data-s="local" type="button"><i></i><span id="status-t">This device only</span></button>
  </header>
  <nav class="tabs"><div class="seg" role="tablist" aria-label="Sections" id="tabs">
    <button role="tab" data-act="tab" data-v="acc" aria-selected="true">Accounts</button>
    <button role="tab" data-act="tab" data-v="pay" aria-selected="false">Paycheck</button>
    <button role="tab" data-act="tab" data-v="hist" aria-selected="false">History</button>
    <button role="tab" data-act="tab" data-v="plan" aria-selected="false">Plan</button>
  </div></nav>
  <main id="app"></main>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-h"><h2 id="sheet-title"></h2><button class="x" type="button" data-act="close" aria-label="Close">&#10005;</button></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="fab" id="fab" type="button" data-act="menu" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>

<script>
(function(){
'use strict';
var LS='envelope-ledger-v1';
var FREQ={w:{n:'Every week',per:52,d:7},b:{n:'Every 2 weeks',per:26,d:14},s:{n:'Twice a month',per:24,d:15},m:{n:'Once a month',per:12,d:0}};
var HUES=[135,92,152,78,118,104,146,70,126,86,158,112];
var SUGGEST=['Checking','Savings','Emergency fund','Bills','Rent','Groceries','Travel','Gifts','Car','Fun money'];

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return 'x'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
var nf=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
var fmt=function(c){return (c<0?'−':'')+nf.format(Math.abs(c)/100)};
var fmtS=function(c){return (c>0?'+':c<0?'−':'')+nf.format(Math.abs(c)/100)};
function toC(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:Math.round(n*100)}
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return iso(new Date())};
var dShort=function(s){return parse(s).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
var dLong=function(s){return parse(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
var dMonth=function(s){return parse(s+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})};
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function daysBetween(a,b){return Math.round((parse(a)-parse(b))/864e5)}

/* ---------- state ---------- */
function hueFor(i){return HUES[i%HUES.length]}
function fresh(){return {v:2,rev:0,main:null,freq:'b',acc:[],log:[]}}
function norm(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.acc))return fresh();
  s.log=Array.isArray(s.log)?s.log:[];
  s.rev=s.rev||0;
  if(!FREQ[s.freq])s.freq='b';
  s.acc.forEach(function(a,i){if(!(a.h>=60&&a.h<=170))a.h=hueFor(i);a.bal=Math.round(a.bal)||0;a.plan=Math.round(a.plan)||0});
  if(!s.acc.some(function(a){return a.id===s.main}))s.main=s.acc.length?s.acc[0].id:null;
  return s;
}
function loadLocal(){try{var r=localStorage.getItem(LS);return r?norm(JSON.parse(r)):null}catch(e){return null}}
var S=loadLocal()||fresh();
var acc=function(id){return S.acc.find(function(a){return a.id===id})};
var accName=function(id){var a=acc(id);return a?a.name:'Removed account'};
var view='acc',hf='all',pcDraft={amt:'',date:today()};

/* ---------- persistence ---------- */
var dbRef=null,saving=false,dirty=false,timer=null;
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setStatus(k){
  var b=$('#status');if(!b)return;
  b.dataset.s=k;
  var t={saved:'Saved',saving:'Saving…',local:'This device only',error:'Not saved · Retry'}[k];
  $('#status-t').textContent=t;
  b.title={saved:'Your budget is saved to your account and available on any device.',saving:'Saving…',local:'Saved on this device only.',error:'The last save failed. Tap to try again.'}[k];
}
function touch(){
  dirty=true;cache();
  clearTimeout(timer);
  if(dbRef){setStatus('saving');timer=setTimeout(persist,500)}else setStatus('local');
}
function persist(){
  clearTimeout(timer);
  if(!dbRef){dirty=false;setStatus('local');return Promise.resolve()}
  if(saving)return Promise.resolve();
  saving=true;dirty=false;setStatus('saving');
  S.rev=Date.now();
  return dbRef.set(JSON.parse(JSON.stringify(S))).then(function(){
    cache();saving=false;
    if(dirty)timer=setTimeout(persist,300);else setStatus('saved');
  },function(){saving=false;dirty=true;setStatus('error')});
}
function hasContent(){return S.acc.length>0||S.log.length>0}
function onSnap(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists){
    if(snap.metadata&&snap.metadata.fromCache)return;
    if(hasContent()){dirty=true;timer=setTimeout(persist,200)}
    return;
  }
  var d=snap.data();
  if(saving||dirty)return;
  if((d.rev||0)>(S.rev||0)){
    S=norm(JSON.parse(JSON.stringify(d)));cache();
    render();setStatus('saved');
  }
}
function initStore(){
  var p=Promise.resolve([null,null]);
  try{if(window.claude&&window.claude.use)p=Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  return p.then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return Promise.resolve(user.id()).then(function(id){return id?db.collection('data/users/'+id).doc('budget'):null});
  }).catch(function(){return null}).then(function(ref){
    if(!ref){setStatus('local');return}
    dbRef=ref;
    return new Promise(function(res){
      var done=false;function fin(){if(!done){done=true;res()}}
      setTimeout(fin,3000);
      try{ref.onSnapshot(function(s){onSnap(s);fin()},function(){dbRef=null;setStatus('local');fin()})}catch(e){dbRef=null;setStatus('local');fin()}
    }).then(function(){if(dirty)persist();else setStatus('saved')});
  });
}

/* ---------- ledger math ---------- */
function fx(e){
  if(e.k==='paycheck')return Object.keys(e.p||{}).map(function(id){return [id,e.p[id]]});
  if(e.k==='transfer')return [[e.a,-e.m],[e.b,e.m]];
  return [[e.a,e.m]];
}
function applyE(e,sign){fx(e).forEach(function(x){var a=acc(x[0]);if(a)a.bal+=sign*x[1]})}
function addEntry(e){S.log.push(e);applyE(e,1);touch()}
function delEntry(id){
  var i=S.log.findIndex(function(e){return e.i===id});if(i<0)return;
  applyE(S.log[i],-1);S.log.splice(i,1);touch();
}
function dist(amt){
  var rem=Math.max(amt,0),p={},planTotal=0,funded=0;
  var rows=S.acc.map(function(a){
    planTotal+=a.plan;var g=Math.min(a.plan,rem);rem-=g;funded+=g;if(g>0)p[a.id]=g;
    return {a:a,plan:a.plan,got:g};
  });
  var main=acc(S.main)||S.acc[0];
  if(rem>0&&main)p[main.id]=(p[main.id]||0)+rem;
  return {rows:rows,p:p,left:rem,short:planTotal-funded,planTotal:planTotal,mainId:main&&main.id};
}
function lastPay(){
  var d=null;S.log.forEach(function(e){if(e.k==='paycheck'&&(!d||e.d>d))d=e.d});return d;
}
function nextPay(from){
  var f=FREQ[S.freq]||FREQ.b;
  if(f.d)return addDays(from,f.d);
  var d=parse(from),day=d.getDate();
  var n=new Date(d.getFullYear(),d.getMonth()+1,1);
  var last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  n.setDate(Math.min(day,last));
  return iso(n);
}
function rowsFor(fid){
  var out=[];
  S.log.forEach(function(e){
    if(fid==='all'){
      var amt=e.m;
      if(e.k==='transfer')amt=0;
      out.push({e:e,amt:amt,del:true});
    }else{
      if(e.k==='paycheck'){if(e.p&&e.p[fid])out.push({e:e,amt:e.p[fid],del:false})}
      else if(e.k==='transfer'){
        if(e.a===fid)out.push({e:e,amt:-e.m,del:false});
        else if(e.b===fid)out.push({e:e,amt:e.m,del:false});
      }else if(e.a===fid)out.push({e:e,amt:e.m,del:true});
    }
  });
  out.sort(function(x,y){return x.e.d<y.e.d?1:x.e.d>y.e.d?-1:(y.e.t||0)-(x.e.t||0)});
  return out;
}
function rowText(r,fid){
  var e=r.e;
  if(e.k==='paycheck'){
    var n=Object.keys(e.p||{}).length;
    return {t:'Paycheck',s:fid==='all'?'Split across '+n+' account'+(n===1?'':'s'):'Paycheck share'};
  }
  if(e.k==='transfer')return {t:e.n||'Transfer',s:accName(e.a)+' → '+accName(e.b)};
  if(e.k==='set')return {t:e.n||'Balance corrected',s:accName(e.a)};
  return {t:e.n||(e.m<0?'Spent':'Received'),s:accName(e.a)};
}

/* ---------- views ---------- */
function nextPayInfo(){
  var lp=lastPay();
  if(!lp)return {d:'—',s:'Add a paycheck to start tracking your pay cycle.',late:false};
  var nx=nextPay(lp),df=daysBetween(nx,today()),t;
  if(df>0)t='In '+df+' day'+(df>1?'s':'');else if(df===0)t='Today';else t=(-df)+' day'+(df<-1?'s':'')+' ago. Ready to add.';
  return {d:dLong(nx),s:t,late:df<0};
}
function chipsHTML(){
  var used=S.acc.map(function(a){return a.name.trim().toLowerCase()});
  var c=SUGGEST.filter(function(n){return used.indexOf(n.toLowerCase())<0});
  return c.length?'<div class="chips">'+c.map(function(n){return '<button type="button" class="chip" data-act="chip" data-n="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div>':'';
}
function vAcc(){
  if(!S.acc.length)return verseHTML()+'<section class="panel callout"><h2>Create your first account</h2><p>An account is any pot of money you want to set aside, like Checking, Rent or Vacation. Give each one a name, then choose how much of every paycheck goes into it.</p><span class="lbl">Tap one to start</span>'+chipsHTML()+'<button class="btn primary" data-act="addacc">Add an account</button></section>';
  var tot=0,planT=0,posT=0,per=FREQ[S.freq].per;
  S.acc.forEach(function(a){tot+=a.bal;planT+=a.plan;if(a.bal>0)posT+=a.bal});
  var bar=posT>0?'<div class="spread" role="img" aria-label="How your money is spread across accounts">'+S.acc.filter(function(a){return a.bal>0}).map(function(a){return '<i style="--h:'+a.h+';flex:'+a.bal+'" title="'+esc(a.name)+' · '+fmt(a.bal)+'"></i>'}).join('')+'</div>':'<div class="spread empty"></div>';
  var np=nextPayInfo();
  var cards=S.acc.map(function(a){
    var r=rowsFor(a.id)[0],last='No activity yet';
    if(r){var tx=rowText(r,a.id);last=dShort(r.e.d)+' · '+tx.t+' '+fmtS(r.amt)}
    return '<article class="env" style="--h:'+a.h+'"><div class="eh"><div class="tab">'+esc(a.name)+'</div><button class="more" data-act="mg" data-id="'+a.id+'" aria-label="Edit or delete '+esc(a.name)+'">&#8943;</button></div><div class="body"><div class="bal'+(a.bal<0?' neg':'')+'">'+fmt(a.bal)+'</div><div class="meta">'+(a.plan?fmtS(a.plan)+' each paycheck':'No amount planned')+'</div><div class="last" title="'+esc(last)+'">'+esc(last)+'</div><button class="btn sm" data-act="tx" data-id="'+a.id+'">Add transaction</button></div></article>';
  }).join('');
  return verseHTML()+'<section class="strip"><div class="panel total"><span class="lbl">Total across accounts</span><div class="big-n'+(tot<0?' neg':'')+'">'+fmt(tot)+'</div>'+bar+'</div>'
    +'<div class="panel gold-card"><span class="lbl">Next payday</span><div class="mid-n">'+np.d+'</div><div class="sub'+(np.late?' neg':'')+'">'+np.s+'</div><button class="btn gold sm" data-act="tab" data-v="pay">Add paycheck</button></div>'
    +'<div class="panel"><span class="lbl">Plan per paycheck</span><div class="mid-n">'+fmt(planT)+'</div><div class="sub">'+per+' paychecks ≈ '+fmt(planT*per)+' a year</div><button class="btn sm" data-act="tab" data-v="plan">Edit plan</button></div></section>'
    +'<div class="row"><h2>Accounts</h2><span class="sub">'+S.acc.length+' account'+(S.acc.length===1?'':'s')+'</span></div>'
    +'<div class="grid">'+cards+'</div>';
}
function previewHTML(){
  var amt=toC(pcDraft.amt),d=dist(amt);
  var rows=d.rows.map(function(r){
    var cell,cls='';
    if(amt<=0){cell=r.plan?fmt(r.plan):'—';cls='mut'}
    else if(r.got>=r.plan){cell=r.plan?fmtS(r.got):'—';cls=r.plan?'pos':'mut'}
    else{cell=r.got?fmt(r.got)+' of '+fmt(r.plan):'Not funded';cls='neg'}
    var extra=(amt>0&&d.left>0&&r.a.id===d.mainId)?'<span class="pl-x pos">+ '+fmt(d.left)+' left over</span>':'';
    return '<li class="pl"><span class="dot" style="--h:'+r.a.h+'"></span><div class="pl-n"><span>'+esc(r.a.name)+'</span>'+extra+'</div><span class="pl-a '+cls+'">'+cell+'</span></li>';
  }).join('');
  var last='';
  if(amt>0){last=d.short>0?'<div><span>Short by</span><span class="neg">'+fmt(d.short)+'</span></div>':'<div><span>Left over</span><span class="'+(d.left>0?'pos':'')+'">'+fmt(d.left)+'</span></div>'}
  var note=d.planTotal===0?'<p class="hint" style="margin-top:10px">No amounts are planned yet, so everything would land in '+esc(accName(d.mainId))+'. Set amounts in Plan.</p>':'';
  return '<ul class="pl-list">'+rows+'</ul><div class="sumrows"><div><span>Paycheck</span><span>'+(amt>0?fmt(amt):'—')+'</span></div><div><span>Planned</span><span>'+fmt(d.planTotal)+'</span></div>'+last+'</div>'+note;
}
function vPay(){
  if(!S.acc.length)return '<section class="panel empty-state"><b>Create an account first</b>Each paycheck is split across your accounts, so add at least one to get started.<div style="margin-top:14px"><button class="btn primary" data-act="addacc">Add an account</button></div></section>';
  var recent=S.log.filter(function(e){return e.k==='paycheck'}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(b.t||0)-(a.t||0)}).slice(0,6);
  var rec=recent.length?'<ul class="recent">'+recent.map(function(e){return '<li><div class="grow"><b>'+dLong(e.d)+'</b><div class="sub">'+Object.keys(e.p||{}).length+' accounts funded</div></div><span class="mono">'+fmt(e.m)+'</span><button class="btn sm ghost" data-act="undo" data-id="'+e.i+'">Undo</button></li>'}).join('')+'</ul>':'<p class="hint" style="margin-top:8px">Paychecks you add will be listed here.</p>';
  return '<div class="two"><section class="panel"><h2>New paycheck</h2><div class="form" style="margin-top:14px">'
    +'<label for="pc-amt">Take-home amount<div class="money big"><span>$</span><input id="pc-amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+esc(pcDraft.amt)+'"></div></label>'
    +'<label for="pc-date">Pay date<input type="date" id="pc-date" value="'+esc(pcDraft.date)+'"></label>'
    +'<p class="hint">Accounts are filled in the order shown in Plan. Anything left over goes to <b>'+esc(accName(S.main))+'</b>.</p>'
    +'<button class="btn primary" id="pc-go" data-act="paygo"'+(toC(pcDraft.amt)>0?'':' disabled')+'>Add paycheck</button></div></section>'
    +'<section class="panel"><h2>Where it goes</h2><div id="pv">'+previewHTML()+'</div></section></div>'
    +'<section class="panel"><h2>Recent paychecks</h2>'+rec+'</section>';
}
function vHist(){
  if(!S.acc.length&&!S.log.length)return '<section class="panel empty-state"><b>Nothing recorded yet</b>Spending, deposits, transfers and paychecks will show up here once you have an account.<div style="margin-top:14px"><button class="btn primary" data-act="addacc">Add an account</button></div></section>';
  var rows=rowsFor(hf);
  var opts='<option value="all"'+(hf==='all'?' selected':'')+'>All accounts</option>'+S.acc.map(function(a){return '<option value="'+a.id+'"'+(hf===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('');
  var head='<div class="hist-head"><h2>History</h2><div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><label class="sr" for="hf" style="position:absolute;left:-9999px">Filter by account</label><select id="hf">'+opts+'</select>'+(S.acc.length?'<button class="btn primary sm" data-act="tx" data-id="'+(hf==='all'?'':hf)+'">Add transaction</button>':'')+'</div></div>';
  if(!rows.length)return head+'<div class="panel empty-state"><b>Nothing recorded yet</b>Spending, deposits, transfers and paychecks will show up here.</div>';
  var out=head,cur='';
  rows.forEach(function(r,idx){
    var m=r.e.d.slice(0,7);
    if(m!==cur){if(cur)out+='</ul>';out+='<h3 class="mh">'+dMonth(m)+'</h3><ul class="hl">';cur=m}
    var t=rowText(r,hf),neutral=r.e.k==='transfer'&&hf==='all';
    var amt=neutral?'<span class="mut">'+fmt(r.e.m)+'</span>':'<span class="'+(r.amt<0?'neg':'pos')+'">'+fmtS(r.amt)+'</span>';
    var btn=r.del?'<button class="x" data-act="del" data-id="'+r.e.i+'" aria-label="'+(r.e.k==='paycheck'?'Undo paycheck':'Delete transaction')+'">&#10005;</button>':'<span></span>';
    out+='<li class="hr"><span class="hd">'+dShort(r.e.d)+'</span><div class="hm"><b>'+esc(t.t)+'</b><small>'+esc(t.s)+'</small></div><div class="ha">'+amt+'</div>'+btn+'</li>';
  });
  return out+'</ul>';
}
function planTotals(){
  var t=0,per=FREQ[S.freq].per;S.acc.forEach(function(a){t+=a.plan});
  return '<div class="panel"><span class="lbl">Per paycheck</span><div class="mid-n">'+fmt(t)+'</div></div><div class="panel"><span class="lbl">Per year ('+per+')</span><div class="mid-n">'+fmt(t*per)+'</div></div><div class="panel"><span class="lbl">Monthly average</span><div class="mid-n">'+fmt(Math.round(t*per/12))+'</div></div>';
}
function vPlan(){
  var rows=S.acc.map(function(a,i){
    return '<div class="prow" data-id="'+a.id+'"><div class="p-top"><div class="mv"><button data-act="up" aria-label="Move up"'+(i===0?' disabled':'')+'>&#9650;</button><button data-act="down" aria-label="Move down"'+(i===S.acc.length-1?' disabled':'')+'>&#9660;</button></div><span class="dot" style="--h:'+a.h+'"></span><input class="pname" data-f="name" value="'+esc(a.name)+'" maxlength="40" aria-label="Account name"></div><div class="p-bot"><div class="money"><span>$</span><input data-f="plan" inputmode="decimal" value="'+(a.plan?(a.plan/100).toFixed(2):'')+'" placeholder="0.00" aria-label="'+esc(a.name)+' amount per paycheck"></div><button class="btn sm ghost" data-act="rm">Remove</button></div></div>';
  }).join('');
  var none=S.acc.length?'':'<p class="hint" style="margin-top:12px">No accounts yet. Add one to start planning.</p>';
  var fq='<label class="main-sel" for="freq-sel">How often you get paid<select id="freq-sel">'+Object.keys(FREQ).map(function(k){return '<option value="'+k+'"'+(k===S.freq?' selected':'')+'>'+FREQ[k].n+'</option>'}).join('')+'</select></label>';
  var sel=S.acc.length?'<label class="main-sel" for="main-sel">Leftover from each paycheck goes to<select id="main-sel">'+S.acc.map(function(a){return '<option value="'+a.id+'"'+(a.id===S.main?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select></label>':'';
  return '<div class="plan-top" id="ptot">'+planTotals()+'</div><section class="panel"><div class="row"><h2>Amount for each paycheck</h2><button class="btn sm primary" data-act="addacc">Add account</button></div><p class="hint" style="margin-top:6px">Paychecks fill accounts from top to bottom. If a paycheck is smaller than the plan, the accounts at the bottom go unfunded.</p><div style="margin-top:8px">'+rows+'</div>'+none+'<div class="opts">'+fq+sel+'</div></section>'
    +'<section class="panel"><div class="row"><div><h2>Your data</h2><p class="hint" style="margin-top:4px">Remove every account and transaction and start over.</p></div><button class="btn sm ghost" data-act="wipe">Erase everything</button></div></section>';
}
var V={acc:vAcc,pay:vPay,hist:vHist,plan:vPlan};
function render(){
  $('#app').innerHTML=V[view]();
  $('#fab').hidden=!S.acc.length;
  $('#app').className='v-'+view;

/* ---------- sheet + toast ---------- */
function openSheet(title,html){
  $('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;
  $('#scrim').hidden=false;
  var f=$('#sheet-body input:not([type=hidden]),#sheet-body select');if(f)setTimeout(function(){f.focus()},30);
}
function closeSheet(){$('#scrim').hidden=true;$('#sheet-body').innerHTML=''}
var tt=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}

function openTx(pref){
  if(!S.acc.length){openAcct();return}
  var kind='spend';
  var a0=pref&&acc(pref)?pref:S.acc[0].id;
  var b0=(S.acc.find(function(a){return a.id!==a0})||S.acc[0]).id;
  var opt=function(sel){return S.acc.map(function(a){return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')};
  openSheet('New transaction','<form id="txf" class="form" novalidate>'
    +'<div class="seg" id="tx-seg"><button type="button" data-k="spend" aria-pressed="true">Spent</button><button type="button" data-k="income" aria-pressed="false">Received</button><button type="button" data-k="transfer" aria-pressed="false">Transfer</button></div>'
    +'<label for="tx-a"><span id="tx-al">Account</span><select id="tx-a">'+opt(a0)+'</select></label>'
    +'<label for="tx-b" id="tx-bw" hidden>To account<select id="tx-b">'+opt(b0)+'</select></label>'
    +'<label for="tx-m">Amount<div class="money big"><span>$</span><input id="tx-m" inputmode="decimal" autocomplete="off" placeholder="0.00"></div></label>'
    +'<label for="tx-d">Date<input type="date" id="tx-d" value="'+today()+'"></label>'
    +'<label for="tx-n">Note (optional)<input id="tx-n" maxlength="80" autocomplete="off" placeholder="e.g. Groceries"></label>'
    +'<p class="hint" id="tx-h" aria-live="polite"></p>'
    +'<button class="btn primary" type="submit">Add transaction</button></form>');
  var A=$('#tx-a'),B=$('#tx-b'),M=$('#tx-m'),H=$('#tx-h');
  function hint(){
    var amt=toC(M.value),a=acc(A.value),h='';
    if(amt>0&&a&&(kind==='spend'||kind==='transfer')&&a.bal-amt<0)h='This takes '+a.name+' to '+fmt(a.bal-amt)+'.';
    H.textContent=h;
  }
  function sync(){
    document.querySelectorAll('#tx-seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===kind?'true':'false')});
    $('#tx-al').textContent=kind==='transfer'?'From account':'Account';
    $('#tx-bw').hidden=kind!=='transfer';
    hint();
  }
  $('#tx-seg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;kind=b.dataset.k;sync()});
  A.addEventListener('change',function(){if(kind==='transfer'&&A.value===B.value){var o=S.acc.find(function(x){return x.id!==A.value});if(o)B.value=o.id}hint()});
  M.addEventListener('input',hint);
  $('#txf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var amt=toC(M.value);
    if(amt<=0){H.textContent='Enter an amount greater than zero.';M.focus();return}
    if(kind==='transfer'&&A.value===B.value){H.textContent='Pick two different accounts.';return}
    var e={i:uid(),t:Date.now(),d:$('#tx-d').value||today(),k:kind,a:A.value,m:kind==='spend'?-amt:amt,n:$('#tx-n').value.trim()};
    if(kind==='transfer'){e.b=B.value;e.m=amt}
    addEntry(e);closeSheet();render();
    toast(kind==='spend'?fmt(amt)+' spent from '+accName(e.a):kind==='income'?fmt(amt)+' added to '+accName(e.a):fmt(amt)+' moved to '+accName(e.b));
  });
}
function verseHTML(){
  return '<aside class="verse" aria-label="Scripture"><p class="vq">&ldquo;Every good gift and every perfect gift is from above, coming down from the Father of lights with whom there is no variation or shadow due to change.&rdquo;</p><p class="vr">James 1:17 &middot; ESV</p><p class="vq2">Everything we have is God&rsquo;s blessing. Give thanks to Him.</p></aside>';
}
function openMenu(){
  var ic=function(d){return '<span class="mi-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg></span>'};
  openSheet('Add','<div class="menu">'
    +'<button class="mi" data-act="tx" data-id="">'+ic('<path d="M5 8h13M14 4l4 4-4 4M19 16H6M10 12l-4 4 4 4"/>')+'<span><b>Add transaction</b><small>Record spending, money received or a transfer</small></span></button>'
    +'<button class="mi" data-act="addacc">'+ic('<path d="M12 5v14M5 12h14"/>')+'<span><b>Add account</b><small>Create a new place to set money aside</small></span></button>'
    +'<button class="mi" data-act="setbal">'+ic('<path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/>')+'<span><b>Set balances</b><small>Update what each account holds right now</small></span></button>'
    +'</div>');
}
function delAcc(id){
  var a=acc(id);if(!a)return;
  S.acc=S.acc.filter(function(x){return x.id!==id});
  if(!acc(S.main))S.main=S.acc.length?S.acc[0].id:null;
  if(hf===id)hf='all';
  touch();render();toast(a.name+' deleted');
}
function openManage(id){
  var a=acc(id);if(!a)return;
  openSheet(a.name,'<form id="mgf" class="form" novalidate>'
    +'<label for="mg-n">Account name<input id="mg-n" maxlength="40" autocomplete="off" value="'+esc(a.name)+'"></label>'
    +'<label for="mg-p">Added from every paycheck<div class="money"><span>$</span><input id="mg-p" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+(a.plan?(a.plan/100).toFixed(2):'')+'"></div></label>'
    +'<p class="hint">Balance now: <b>'+fmt(a.bal)+'</b>. To correct it, use Set balances.</p>'
    +'<p class="hint" id="mg-h" aria-live="polite"></p>'
    +'<button class="btn primary" type="submit">Save changes</button>'
    +'<button class="btn danger" type="button" data-act="mgdel" data-id="'+a.id+'">Delete account</button>'
    +'<p class="fine">Deleting removes this account and its balance from your total. Past transactions stay in History.</p></form>');
  $('#mgf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var name=$('#mg-n').value.trim(),H=$('#mg-h');
    if(!name){H.textContent='Give the account a name.';return}
    if(S.acc.some(function(x){return x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase()})){H.textContent='You already have an account called '+name+'.';return}
    a.name=name;a.plan=Math.max(0,toC($('#mg-p').value));
    touch();closeSheet();render();toast('Changes saved');
  });
}
function openAcct(pre){
  openSheet('Add an account','<form id="acf" class="form" novalidate>'
    +'<label for="ac-n">Account name<input id="ac-n" maxlength="40" autocomplete="off" placeholder="e.g. Vacation" value="'+esc(pre||'')+'"></label>'
    +chipsHTML()
    +'<label for="ac-b">Balance today (optional)<div class="money"><span>$</span><input id="ac-b" inputmode="decimal" autocomplete="off" placeholder="0.00"></div></label>'
    +'<label for="ac-p">Added from every paycheck (optional)<div class="money"><span>$</span><input id="ac-p" inputmode="decimal" autocomplete="off" placeholder="0.00"></div></label>'
    +'<p class="hint" id="ac-h" aria-live="polite"></p>'
    +'<button class="btn primary" type="submit">Add account</button></form>');
  $('#acf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var name=$('#ac-n').value.trim(),H=$('#ac-h');
    if(!name){H.textContent='Give the account a name.';$('#ac-n').focus();return}
    if(S.acc.some(function(a){return a.name.trim().toLowerCase()===name.toLowerCase()})){H.textContent='You already have an account called '+name+'.';$('#ac-n').focus();return}
    var a={id:'a'+uid(),name:name,h:hueFor(S.acc.length),bal:0,plan:Math.max(0,toC($('#ac-p').value))};
    S.acc.push(a);
    if(!acc(S.main))S.main=a.id;
    var b=toC($('#ac-b').value);
    if(b!==0)addEntry({i:uid(),t:Date.now(),d:today(),k:'set',a:a.id,m:b,n:'Starting balance'});else touch();
    closeSheet();render();toast(name+' added');
  });
}
function openBalances(){
  var rows=S.acc.map(function(a){
    return '<div class="brow"><div class="bn"><span class="dot" style="--h:'+a.h+'"></span><span>'+esc(a.name)+'</span></div><div class="money"><span>$</span><input data-b="'+a.id+'" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+(a.bal/100).toFixed(2)+'" aria-label="'+esc(a.name)+' balance"></div></div>';
  }).join('');
  openSheet('Set balances','<p class="hint" style="margin:0 0 6px">Type what each account holds right now. Differences are recorded in History as corrections.</p>'
    +'<form id="balf">'+rows+'<div class="bsum"><span>Total</span><span id="bsum"></span></div><div class="row"><button class="btn primary" type="submit">Save</button></div></form>');
  function tot(){var t=0;document.querySelectorAll('#balf [data-b]').forEach(function(i){t+=toC(i.value)});$('#bsum').textContent=fmt(t)}
  tot();
  $('#balf').addEventListener('input',function(ev){if(ev.target.dataset.b)tot()});
  $('#balf').addEventListener('submit',function(ev){
    ev.preventDefault();
    var changed=0;
    document.querySelectorAll('#balf [data-b]').forEach(function(i){
      var a=acc(i.dataset.b);if(!a)return;
      var diff=toC(i.value)-a.bal;
      if(diff!==0){addEntry({i:uid(),t:Date.now(),d:today(),k:'set',a:a.id,m:diff,n:'Balance corrected'});changed++}
    });
    closeSheet();render();
    toast(changed?'Balances updated':'No changes');
  });
}

/* ---------- actions ---------- */
var armed=null;
function twice(btn,label){
  if(armed&&armed.btn===btn){clearTimeout(armed.t);armed=null;return true}
  if(armed){clearTimeout(armed.t);reset(armed.btn);armed=null}
  btn.dataset.orig=btn.innerHTML;btn.textContent=label;btn.classList.add('armed');
  armed={btn:btn,t:setTimeout(function(){reset(btn);armed=null},3000)};
  return false;
}
function reset(btn){if(btn&&btn.dataset.orig!=null){btn.innerHTML=btn.dataset.orig;btn.classList.remove('armed')}}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act;
  if(act==='tab'){view=b.dataset.v;render();window.scrollTo(0,0);return}
  if(act==='close'){closeSheet();return}
  if(act==='tx'){openTx(b.dataset.id);return}
  if(act==='setbal'){openBalances();return}
  if(act==='menu'){openMenu();return}
  if(act==='mg'){openManage(b.dataset.id);return}
  if(act==='mgdel'){if(!twice(b,'Tap again to delete'))return;closeSheet();delAcc(b.dataset.id);return}
  if(act==='addacc'){openAcct();return}
  if(act==='chip'){var cn=$('#ac-n');if(cn){cn.value=b.dataset.n;var cb=$('#ac-b');if(cb)cb.focus()}else openAcct(b.dataset.n);return}
  if(act==='wipe'){if(!twice(b,'Erase all?'))return;S=fresh();hf='all';pcDraft={amt:'',date:today()};view='acc';touch();render();window.scrollTo(0,0);toast('Everything erased');return}
  if(act==='retry'){if(b.dataset.s==='error')persist();return}
  if(act==='paygo'){
    var amt=toC(pcDraft.amt);if(amt<=0||!S.acc.length)return;
    var d=dist(amt);
    addEntry({i:uid(),t:Date.now(),d:pcDraft.date||today(),k:'paycheck',m:amt,p:d.p});
    var n=Object.keys(d.p).length;
    pcDraft={amt:'',date:today()};view='acc';render();window.scrollTo(0,0);
    toast(fmt(amt)+' split across '+n+' account'+(n===1?'':'s')+(d.short>0?' (short by '+fmt(d.short)+')':''));
    return;
  }
  if(act==='undo'){if(!twice(b,'Undo?'))return;delEntry(b.dataset.id);render();toast('Paycheck removed and balances restored');return}
  if(act==='del'){if(!twice(b,'Delete?'))return;delEntry(b.dataset.id);render();toast('Removed and balances restored');return}
  var row=b.closest('.prow'),id=row&&row.dataset.id;
  if(act==='up'||act==='down'){
    var i=S.acc.findIndex(function(a){return a.id===id}),j=act==='up'?i-1:i+1;
    if(j<0||j>=S.acc.length)return;
    var t=S.acc[i];S.acc[i]=S.acc[j];S.acc[j]=t;touch();render();
    var nb=document.querySelector('.prow[data-id="'+id+'"] [data-act="'+act+'"]');if(nb&&!nb.disabled)nb.focus();
    return;
  }
  if(act==='rm'){
    var a=acc(id);if(!a)return;
    if(!twice(b,a.bal?'Drop '+fmt(a.bal)+'?':'Remove?'))return;
    delAcc(id);return;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='pc-amt'){pcDraft.amt=t.value;$('#pv').innerHTML=previewHTML();$('#pc-go').disabled=toC(t.value)<=0;return}
  if(t.dataset&&t.dataset.f){
    var row=t.closest('.prow'),a=row&&acc(row.dataset.id);if(!a)return;
    if(t.dataset.f==='name')a.name=t.value;else a.plan=Math.max(0,toC(t.value));
    touch();
    if(t.dataset.f==='plan')$('#ptot').innerHTML=planTotals();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='pc-date')pcDraft.date=t.value||today();
  else if(t.id==='hf'){hf=t.value;render()}
  else if(t.id==='freq-sel'){S.freq=t.value;touch();render();toast('Pay schedule: '+FREQ[S.freq].n.toLowerCase())}
  else if(t.id==='main-sel'){S.main=t.value;touch();toast(accName(S.main)+' will receive leftovers')}
  else if(t.dataset&&t.dataset.f==='name'&&!t.value.trim()){var a=acc(t.closest('.prow').dataset.id);if(a){a.name='Untitled';t.value=a.name;touch()}}
  else if(t.dataset&&t.dataset.f==='plan'){var a2=acc(t.closest('.prow').dataset.id);if(a2)t.value=a2.plan?(a2.plan/100).toFixed(2):''}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#scrim').hidden)closeSheet()});
$('#scrim').addEventListener('click',function(ev){if(ev.target.id==='scrim')closeSheet()});

/* ---------- boot ---------- */
render();
setStatus('local');
initStore().then(function(){
  render();
});
})();
</script>
